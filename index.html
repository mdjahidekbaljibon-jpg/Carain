<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101014"><title>CARAIN AI</title>
<style>
:root{color-scheme:dark;--bg:#101014;--panel:#19191f;--line:#303039;--muted:#a4a4b2;--accent:#d8a5ff;--text:#f5f2f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,"Noto Sans Bengali",sans-serif;height:100dvh;display:flex;flex-direction:column}
header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:#141419}
.brand{font-weight:750;letter-spacing:.4px}.brand span{color:var(--accent)}button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 13px}
#chat{flex:1;overflow:auto;padding:18px 14px 24px;display:flex;flex-direction:column;gap:14px;width:100%;max-width:850px;margin:auto}
.welcome{margin:auto;text-align:center;max-width:520px;padding:20px}.orb{width:62px;height:62px;border-radius:22px;background:linear-gradient(135deg,#d8a5ff,#8e75d9);display:grid;place-items:center;color:#20152b;font-size:27px;margin:0 auto 18px}
.welcome h1{font-size:25px;margin:0 0 8px}.welcome p{color:var(--muted);line-height:1.6;margin:0}
.msg{max-width:88%;padding:13px 15px;border-radius:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#33283e;border:1px solid #58436a}.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.msg img{max-width:100%;max-height:260px;border-radius:12px;display:block;margin-bottom:8px}
#composerWrap{padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#141419}
#composer{max-width:850px;margin:auto;border:1px solid #44414c;background:#1c1b22;border-radius:20px;padding:9px;display:flex;gap:8px;align-items:flex-end}
#message{flex:1;min-width:0;max-height:140px;resize:none;background:transparent;border:0;outline:0;color:var(--text);font:inherit;padding:9px}
#send{background:var(--accent);color:#21152a;border:0;font-weight:700;min-width:48px}
.tools{display:flex;gap:7px;align-items:center}.tools button{padding:9px}.hint{font-size:11px;color:var(--muted);text-align:center;margin:7px 0 0}
#file{display:none}.status{font-size:12px;color:var(--muted);padding:0 8px;max-width:850px;margin:0 auto 6px;width:100%}
@media(min-width:700px){header{padding:0 max(22px,calc((100vw - 850px)/2))}.msg{max-width:78%}}
</style></head>
<body>
<header><div class="brand">CARAIN <span>AI</span></div><button id="newChat" aria-label="নতুন চ্যাট">＋ নতুন চ্যাট</button></header>
<main id="chat" aria-live="polite"><section class="welcome" id="welcome"><div class="orb">✦</div><h1>কী নিয়ে কথা বলতে চাও?</h1><p>CARAIN AI-তে বাংলায় বা ইংরেজিতে লিখে শুরু করো। ছবি যোগ করে সেটি সম্পর্কেও প্রশ্ন করতে পারো।</p></section></main>
<div id="composerWrap"><div class="status" id="status">AI সংযোগ প্রস্তুত হলে এখানে অবস্থা দেখাবে।</div><form id="composer"><div class="tools"><button type="button" id="attach" title="ছবি যোগ করো">＋</button></div><textarea id="message" rows="1" placeholder="CARAIN-কে মেসেজ লেখো..." required></textarea><button id="send" type="submit">➤</button><input id="file" type="file" accept="image/*"></form><div class="hint">AI-এর উত্তর ভুল হতে পারে—গুরুত্বপূর্ণ তথ্য যাচাই করে নাও।</div></div>
<script>
const chat=document.getElementById('chat'), form=document.getElementById('composer'), input=document.getElementById('message'), fileInput=document.getElementById('file'), statusEl=document.getElementById('status');
let history=[], image=null, busy=false;
function addMessage(role,text,img){document.getElementById('welcome')?.remove();const el=document.createElement('div');el.className='msg '+(role==='user'?'user':'ai');if(img){const im=document.createElement('img');im.src=img;el.append(im)}const t=document.createElement('div');t.textContent=text;el.append(t);chat.append(el);chat.scrollTop=chat.scrollHeight;return el}
document.getElementById('attach').onclick=()=>fileInput.click();
fileInput.onchange=()=>{const f=fileInput.files[0];if(!f)return;if(!f.type.startsWith('image/')){statusEl.textContent='এই প্রাথমিক সংস্করণে শুধু ছবি যোগ করা যাচ্ছে।';return}if(f.size>5*1024*1024){statusEl.textContent='ছবিটি ৫ MB-এর চেয়ে ছোট করে দাও।';return}const reader=new FileReader();reader.onload=()=>{image={data:String(reader.result).split(',')[1],mimeType:f.type,preview:String(reader.result)};statusEl.textContent='ছবি যোগ হয়েছে: '+f.name};reader.readAsDataURL(f)};
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px'});
form.onsubmit=async e=>{e.preventDefault();const message=input.value.trim();if((!message&&!image)||busy)return;const attached=image;addMessage('user',message||'এই ছবিটি বিশ্লেষণ করো।',attached?.preview);input.value='';input.style.height='auto';image=null;fileInput.value='';busy=true;const loading=addMessage('ai','উত্তর তৈরি হচ্ছে…');document.getElementById('send').disabled=true;
try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:message||'এই ছবিটি বিশ্লেষণ করো।',history:history.slice(-12),image:attached?{data:attached.data,mimeType:attached.mimeType}:null})});const data=await res.json();if(!res.ok)throw new Error(data.error||'সার্ভার থেকে উত্তর পাওয়া যায়নি');loading.querySelector('div').textContent=data.reply;history.push({role:'user',text:message||'ছবিটি বিশ্লেষণ করো'},{role:'model',text:data.reply});statusEl.textContent='সংযুক্ত';}catch(err){loading.querySelector('div').textContent='সংযোগে সমস্যা: '+err.message;statusEl.textContent='AI সার্ভার সেটআপ বাকি থাকতে পারে।'}finally{busy=false;document.getElementById('send').disabled=false;chat.scrollTop=chat.scrollHeight}};
document.getElementById('newChat').onclick=()=>{history=[];image=null;chat.innerHTML='<section class="welcome" id="welcome"><div class="orb">✦</div><h1>নতুন কথোপকথন</h1><p>কী নিয়ে কথা বলতে চাও?</p></section>';statusEl.textContent='নতুন চ্যাট শুরু হয়েছে।'};
</script></body></html>
